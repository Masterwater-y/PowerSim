# Source-causal full-system page-walk pilot. This overlay is intentionally not
# the production alias: it requires an FST `.vmap` v2 physical-PTE sidecar and
# still exposes gem5's no-coalescing follower walks as a residual counter.
config.include = gem5-fs-native-kernel.cfg

# Q is a fixed execution/checkpoint contract for this experiment. It is never
# searched or selected from CPI error.
sim.interval_max_cycles = 1024

# The physical-walk implementation currently uses the exact scalar response
# path and one transactional state weave. Disable throughput-only shortcuts
# whose state contracts do not yet include page-walk requests.
sim.interval_private_preview = false
sim.interval_reweave_passes = 1
core.response_materialized_uop_fast_kernel = false
core.response_causal_block_transfer = false
core.response_event_only_approximation = false
ruby.sequencer_load_admission = false

# Preserve the already source-derived static x86 memory-ordering semantics;
# this is orthogonal to address translation and is shared by the paired
# fixed-latency control.
core.committed_static_memory_ordering = true

dtlb.miss_model = timing_walk
dtlb.hierarchy_walk = true
dtlb.page_walk_address_mode = physical_sidecar
dtlb.page_walk_levels = 4
dtlb.page_walkers = 1
dtlb.coalesce_misses = false
dtlb.speculative_path_state = false

# Lower bound only: four L1 tag/data responses plus the source-defined O3
# deferred-IQ restart. The hierarchy response can extend this value; it can
# never shorten or replace an observed cache path.
dtlb.page_walk_restart_latency = 2
dtlb.page_walk_latency = 10

# Compatibility name for ordinary-load timing, now the maintained default.
# Native response + dependent-issue witnesses establish a 2-cycle resident
# data path followed by 1 cycle to visible producer readiness. This is not
# a universal CPU constant and must not retime atomic/store execution.
# Default selection was explicitly requested on 2026-09-12; independent
# accuracy/trend/throughput qualification remains a separate claim.
config.include = gem5-fs-native-kernel.cfg

core.ordinary_load_latency = 3
core.load_response_to_ready = 1

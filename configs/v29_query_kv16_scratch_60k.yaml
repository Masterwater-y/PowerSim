# v29 target-query-preserving, remote-K/V-only compression.
# Trained end-to-end from random initialization for 60K steps.

chunk:
  K: 256
  horizons: [16, 32, 64, 128, 256, 512, 1024]
  sample_period_cycles: 64
  sequence_length: 4
  sequence_stride: 4

scheduler:
  target_stride: 32
  min_step_cycles: 4
  max_step_cycles: 1024
  max_no_progress_steps: 64

uarch:
  tick_per_cycle: auto

model:
  d_field: 64
  d_dynamic_field: 16
  d_static: 768
  d_dyn: 960
  n_dyn_heads: 15
  n_dyn_layers: 8
  ffn_dim: 3840
  sdpa_backend: auto
  # Local attention remains active in every layer. Cross-core attention runs
  # only in layers 4 and 8, using all 256 target UOP queries.
  cross_attention_backend: query_preserving_kv
  cross_attention_layers: [4, 8]
  cross_anchor_count: 16
  cross_anchor_positional_count: 8
  cross_anchor_stabilization: true
  cross_anchor_fp32_training: true
  cross_latent_count: 0
  cross_latent_stabilization: false
  qrkv_projection_backend: separate
  cross_target_block: 0
  dropout: 0.1
  commit_temperature: 4.0
  gap_softplus_beta: 4.0

train:
  seed: 1234
  cross_compression_from_scratch: true
  lr: 1.0e-4
  warmup_steps: 2000
  total_steps: 60000
  minimum_lr_ratio: 0.10
  weight_decay: 5.0e-2
  batch_samples: 1
  num_workers: 4
  trace_balanced_sampling: true
  coverage_first_sampling: true
  coverage_first_epochs: 1
  validation_max_sequences: 512
  evaluate_at_start: false
  epochs: 100
  log_every: 20
  eval_every: 1000
  save_every: 500
  milestone_steps: [30000]
  amp_dtype: bf16
  profile_attention: false
  gradient_clip: 1.0
  time_huber_beta: 0.2
  progress_count_beta: 8.0
  branch_count_beta: 1.0
  loss_weights:
    commit_time: 1.0
    prefix_bce: 0.5
    progress_count: 0.5
    cumulative: 0.25
    branch_token: 0.10
    branch_count: 0.10

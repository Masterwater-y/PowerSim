# SPR-M4: functional translation + UART/APIC device service.
# Default decision: 2026-11-16. M1/M2/M3 profiles remain frozen.
# Shared target-platform parameters verified in all ten current C4/C8 sources.
# Change these only when the target platform changes; no trace hash or gem5
# code revision is required. Device-only control: device_io.enabled=false.
config.include = spr-m3-functional-translation.cfg
device_io.enabled = true
device_io.clock_period_ticks = 385
device_io.uart_address = 0x80000000000003f8
device_io.uart_size = 8
device_io.uart_latency_ticks = 100000
device_io.apic_latency_ticks = 100000

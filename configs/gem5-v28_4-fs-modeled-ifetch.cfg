# Versioned native full-system I-side hierarchy profile. It is selected by
# the maintained gem5-fs-native-kernel.cfg production alias as of 2026-08-25.
#
# The parent is the validated v28_2 native profile. This overlay adds only
# committed instruction-cache requests, so its PMU/CPI delta can be compared
# directly without requiring a gem5-specific virtual-to-physical map. Direct
# I-side outcomes are reported separately from the data-demand PMU oracle;
# shared cache pollution and timing still affect later data requests.
config.include = gem5-v28_2-fs-native-kernel.cfg

core.fetch_supply_model = true
cache.l1i.enabled = true
core.fetch_supply_physical_request_ledger = true
core.fetch_supply_lower_hierarchy = true

# Preserve the virtual 4-KiB page offset, then deterministically map
# (address-space ID, virtual page, seed) into the configured 4-GiB DRAM. The
# upper half of this width is used only as a disjoint cache/directory identity;
# DRAM receives the corresponding capacity-valid modeled placement.
trace.instruction_address_mode = modeled
trace.instruction_physical_address_bits = 48
trace.instruction_page_bits = 12
trace.instruction_mapping_seed = 1
trace.require_instruction_page_map = false

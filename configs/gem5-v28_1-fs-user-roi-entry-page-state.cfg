# Full-system user-only profile with exact ROI-entry page state.
#
# User-only remains an explicit overlay because exact fault selection currently
# exposes an inaccurate whole-page cache-fill overlap in the simplified model.
# SE and generic traces are not required to carry the page-state sidecar.
config.include = gem5-v28_1-fs-user.cfg

page_fault.roi_entry_page_state_model = true

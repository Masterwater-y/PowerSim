# Opt-in functional-only translation approximation. Current SPR source:
# DTLB 96/6-way, STLB 2048/8-way, D-side STLB return 6 cycles, 4 walkers.
# This is a candidate, not a new frozen milestone or a throughput acceptance.
# Settings-only overlay: append these settings after a source-bound SPR config.
# Deliberately no include that could overwrite source geometry or thread plans.
dtlb.functional_model = true
dtlb.functional_l1_ways = 6
dtlb.stlb_hit_latency = 6
dtlb.page_walkers = 4
dtlb.max_pending_translations = 512
dtlb.coalesce_misses = false
dtlb.hierarchy_walk = false
dtlb.speculative_path_state = false
core.spr_dtlb_stlb_proxy = false
core.spr_id_stlb_retired_order = false
core.spr_id_stlb_allow_global = false
core.spr_id_stlb_allow_large = false

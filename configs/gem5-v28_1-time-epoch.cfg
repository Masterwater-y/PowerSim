# Stage-2 time-epoch / sparse-weave prototype for gem5 v28.1.
# A 4096-UOP producer chunk is only a decode/transport microbatch.  Each core
# extends lookahead through as many chunks as needed to cover the common
# 1024-cycle epoch; shared events are woven once for that time interval.
sim.cores = 4
sim.chunk_instructions = 4096
# Keep enough 4096-UOP chunks resident to cover the 1024-cycle epoch so
# producers can prepare epoch N+1 while the coordinator weaves epoch N.
sim.lookahead_chunks = 8
sim.interval_target_uops = 256
# Accuracy-contract hyperparameter: keep Q fixed at 1024 for all component
# alignment, ablation, and C4-C32 acceptance runs. The current approximate
# cross-interval closure is Q-sensitive; do not tune other parameters at a
# different Q or treat a Q sweep as a microarchitecture change.
sim.interval_max_cycles = 1024
sim.interval_scheduler = time_epoch
# The adaptive ownership-domain path is exact against canonical replay, repairs
# only affected private-set suffixes, and passed the complete 92-case C4-C32
# throughput gate. Small/low-yield boundaries bypass it below.
sim.interval_private_preview = true
# Dedicated domain workers execute certified private-cache prefixes. Preview
# is committed only when the line/private-set certificate proves that a
# deferred invalidation cannot alter a later access in that state component.
# Values above one enable the experimental corrected-arrival transaction.
# The B0 C4/C32 pilot failed both CPI and throughput gates because it replayed
# whole risk epochs, so production stays at one until B1 component-sparse
# repair replaces that path.
sim.interval_reweave_passes = 1
# B1b timing-only corrected arrival remains an ablation.  At Q=1024 it repairs
# IQ72/IQ88, but the complete threshold suite shows severe over-correction on
# ROB and small-IQ cases because the fixed-point repeatedly exposes the same
# interval gap.  Production therefore stays on the single-pass path while the
# entry-snapshot suffix carry below is validated.
sim.interval_causal_timing = false
# B3 one-pass response/shared-queue closure. It reuses the canonical
# cache/directory path, retimes CHA/LLC-MSHR/DRAM once at corrected issue
# times, and rolls back an epoch if the corrected arrival order is unstable
# or leaves the Q=1024 boundary. Pair it with corrected_suffix_carry during
# experiments so boundary-crossing requests remain in the resident suffix.
# Keep disabled in the production baseline until the directed and complete
# uarch-generalization gates below are recorded.
sim.interval_response_retime = false
# Experimental ROB-head-local response closure.  It carries only an active
# ordered-retirement suffix across the fixed Q=1024 checkpoint and commits a
# timing-only shared replay after a stable local certificate.  Keep disabled
# until fanout/dense and both 48-case gates below have been recorded.
sim.interval_rob_head_suffix_replay = false
sim.interval_causal_passes = 4
sim.interval_causal_max_closure_events = 4096
# Experimental B2 boundary repair: response-delayed memory requests whose
# corrected issue is beyond [T,T+1024] remain in the resident suffix.  Every
# retry starts from the same epoch-entry cache/controller/core-counter state.
sim.interval_corrected_suffix_carry = false
# Per-core timing feedback is target-state equivalent in the permanent decode
# worker pool, but Q=1024 tasks are too small to amortize preemption of a
# 4096-UOP producer chunk. Keep the experimental path available for controlled
# equivalence tests; owner-domain workers will provide the production
# parallelism without sharing decode threads.
# Per-core response feedback is independent until the certified global
# boundary; execute those tasks concurrently on multicore hosts.
sim.interval_parallel_feedback = true
# Dedicated ownership-domain workers. Zero selects min(target cores, 8).
sim.domain_workers = 0
# Require about 256 certified-safe events per default worker. Smaller or
# low-yield real-trace boundaries remain on the canonical fast path.
sim.domain_min_events = 2048
# Cross-line order inversions cannot alter the currently modeled cache path;
# omit the all-event Fenwick pass.
sim.interval_full_order_audit = false
# Exact same-line inversion counting is also diagnostic-only and does not
# participate in timing, cache, directory, or PMU state. Production disables
# it; CI/accuracy shadow runs can re-enable it explicitly.
sim.interval_same_line_order_audit = false
# Audit-only; enable for component attribution runs. It does not participate
# in the C2 timing equations and must preserve the target-state hash.
sim.cpi_attribution = false

core.model = interval_weave
core.fetch_width = 8
# BaseO3CPU fetchBufferSize=64. A pipelined block request enters Ruby's
# mandatory queue (latency 1); a resident L0-I hit calls the sequencer back
# directly, so the next fetch group sees one intervening empty cycle. The
# protocol request_latency=2 is a lower-level GETS miss edge, not an L0-I-hit
# latency. Wrong-path/refetch requests remain outside the functional trace and
# are reported as a residual, not fabricated.
core.fetch_buffer_bytes = 64
core.fetch_buffer_refill_latency = 1
# Committed-PC L1I state is an isolated frontend ablation until it passes the
# full FS and historical SE gates. Geometry and latency are taken from the
# captured Ruby L0 Icache; a miss adds the target private-L2 hit latency below
# without generating wrong-path instruction accesses or PMU.
cache.l1i.enabled = false
cache.l1i.size = 32KiB
cache.l1i.associativity = 8
cache.l1i.line_size = 64
cache.l1i.hit_latency = 1
cache.l1i.miss_penalty = 6
cache.l1i.replacement = lru
cache.l1i.speculative_entry_state = false
cache.l1i.speculative_path_state = false
core.decode_width = 8
core.rename_width = 8
core.dispatch_width = 8
core.issue_width = 8
core.writeback_width = 8
core.commit_width = 8
core.fetch_queue_entries = 32
core.rob_entries = 192
core.iq_entries = 64
core.lq_entries = 32
core.sq_entries = 32
# Default-off committed-path rename/window audit. It records n_dst token
# lifetimes and a mutually exclusive dispatch-gate ledger without changing
# timing or PMU state.
core.committed_pipeline_audit = false
# Committed-path-only, per-class rename free-list experiment. Baseline free
# entries are gem5 physical totals minus x86 architectural mappings:
# Int 256-38, Float 256-48, Vec 256-1, CC 1280-5. FST v7 carries only
# architectural destination classes; no wrong-path allocation is fabricated.
# The C2 sparse scoreboard delays each release to response-corrected ordered
# retirement and persists pending releases across Q checkpoints. Production
# remains disabled until the directed business and both 48-case gates pass.
core.rename_free_list = false
# Separate ablation: carry per-class allocation/release through C2 and delay
# release to response-corrected ordered retirement. Keep disabled with the base
# free list until the directed business gate no longer over-corrects.
core.response_rename_feedback = false
core.rename_int_free_entries = 218
core.rename_float_free_entries = 208
core.rename_vec_free_entries = 255
core.rename_cc_free_entries = 1275
core.fetch_to_decode = 1
core.decode_to_rename = 1
core.rename_to_dispatch = 2
# Experimental gem5 BaseO3CPU backward time-buffer edges. The full 92-case
# gate showed that adding these delays on top of the interval occupancy model
# double-charges low-core business workloads, so production keeps them zero.
core.iew_to_rename = 0
core.commit_to_rename = 0
core.dispatch_to_issue = 1
# FastSim's FU op latency is issue-to-producer-ready, so the gem5 IEW
# time-buffer edge is already folded into that abstraction.
core.issue_to_execute = 0
core.execute_to_commit = 0
# Keep the core's minimum load/atomic producer-ready edge independent of the
# Ruby cache-controller response path below.  Four cycles preserves the
# previously validated O3 lower-bound schedule while L0/L1 response timing is
# source-aligned independently; it can be replaced directly for another CPU.
core.minimum_load_latency = 4
# Shared responses extend load/atomic IQ residency in the committed interval
# checkpoint instead of being reduced to a tail-only correction.
core.response_queue_feedback = true
# B3 persistent response-state experiment. The implementation is validated
# separately before changing the production CPI baseline.
core.response_rob_lsq_feedback = false
# C2 sequence-tagged sparse completion/ROB/LSQ scoreboard.  This file is the
# accuracy reference profile used by the current C4--C32 results; disable it
# explicitly only for a component ablation.  Keeping the setting in the file
# avoids a hidden command-line override changing the meaning of "baseline".
core.response_sparse_scoreboard = true
# P0 incremental feedback checkpoint. The accepted block keeps the entry ROB
# ring read-only and commits only its final ROB-sized exit window; exact
# per-UOP ring writes remain available via --response-block-summary=false.
core.response_block_summary = true
# Producer records the exact load/store queue class of in-range memory events;
# feedback uses it instead of rescanning every event in the UOP.
core.response_memory_descriptor = true
# Validate one maximum stage cycle, then encode all five Q16 descriptors.
core.response_batch_timing_encode = true
# C4 response-cone resource closure. It reuses the target issue width, FUPool,
# cache-port, and writeback parameters above/below; no workload calibration is
# involved. Keep disabled until the C16/C32 accuracy and >5M-UOP/s gate passes.
core.response_sparse_resource_repair = false
# C3-B checkpoint activity certificate.  It only selects a reduced
# state-transition loop after proving a memory-free segment has no live
# response/ROB/IQ/dependency edge; failures retain the complete C2 path.
core.response_activity_certificate = true
core.response_retire_exposure = 1.0
core.needs_tso = true
core.integer_alu_units = 6
core.integer_multiply_units = 2
core.float_simple_units = 4
core.float_complex_units = 2
core.simd_units = 4
core.predicate_units = 1
core.memory_units = 4
core.system_units = 1
core.cache_load_ports = 200
core.cache_store_ports = 200
core.integer_alu_latency = 1
core.integer_multiply_latency = 3
core.integer_divide_latency = 1
core.integer_alu_pipelined = true
core.integer_multiply_pipelined = true
core.integer_divide_pipelined = false
core.float_simple_latency = 2
core.float_multiply_latency = 4
core.float_multiply_accumulate_latency = 5
core.float_misc_latency = 3
core.float_divide_latency = 12
core.float_sqrt_latency = 24
core.float_simple_pipelined = true
core.float_complex_pipelined = true
core.float_divide_pipelined = false
core.float_sqrt_pipelined = false
core.simd_latency = 1
core.predicate_latency = 1
core.system_latency = 1
# gem5 SE has no guest-kernel instruction stream.  A marked syscall drains
# older OoO work, uses the system FU above, and restarts the frontend.  Keep
# service at zero unless the baseline defines an explicit simulated ABI delay;
# blocking duration belongs to the future thread-event/scheduler model.
syscall.service_latency = 0
syscall.restart_latency = 1
core.memory_exposure = 1.0
trace.strict_physical_address = true
trace.require_virtual_page_token = true

# The baseline is gem5 SE: an x86 TLB miss synchronously consults
# Process::pTable and fills the TLB without timing-walker service. FS profiles
# may select timing_walk and use the explicit walker fields below.
dtlb.enabled = true
dtlb.entries = 64
dtlb.hit_latency = 0
dtlb.miss_model = se_atomic
dtlb.page_walk_latency = 1
dtlb.page_walkers = 1
dtlb.coalesce_misses = false

# CPU-side Ruby Sequencer capacity from the captured config.ini. This is not
# the same resource as each controller's number_of_TBEs=256 below.
ruby.sequencer_max_outstanding = 16

cache.l1d.size = 32KiB
cache.l1d.associativity = 8
cache.l1d.line_size = 64
# MESI_Three_Level L0 hits consume the 1-cycle mandatory-queue edge and
# return to the O3 load writeback path on the following cycle.  This is the
# end-to-end issue-to-producer-ready latency, not CacheMemory's tag latency.
cache.l1d.hit_latency = 2
cache.l1d.replacement = lru
# The captured MESI_Three_Level profile uses number_of_TBEs=256 for each
# private controller.  FastSim models those transaction slots as miss lanes.
cache.l1d.mshrs = 256

cache.l2.size = 1MiB
cache.l2.associativity = 8
cache.l2.line_size = 64
# A private-L1 hit adds L0->L1 request_latency=2 and
# L1->L0 response_latency=2 to the same mandatory/callback path.
cache.l2.hit_latency = 6
# Captured l2_controllers*.cache uses TreePLRURP with 8 leaves.
cache.l2.replacement = tree_plru
cache.l2.mshrs = 256

cache.llc.size = 64MiB
cache.llc.associativity = 16
cache.llc.line_size = 64
# Shared-L3 controller and private-controller callback work not represented by
# the network calendar. An LLC hit is 5 + 12 + 5 = 22 cycles in the compact
# path; a miss adds the directory-only stages configured below.
cache.llc.hit_latency = 12
# Captured l3_controllers*.L2cache uses TreePLRURP with 16 leaves.
cache.llc.replacement = tree_plru
cache.llc.inclusive = false
# number_of_TBEs=256 is per L3 controller, not one global pool.  FastSim
# therefore instantiates this many lanes independently for every CHA slice.
cache.llc.mshrs = 256

uncore.coherence = true
uncore.cha_count = 8
uncore.cha_xor_hash = false
# Fully connected Garnet path: external link + source router + internal link
# + destination router + external link, all configured at one cycle.
uncore.noc_one_way_latency = 5
uncore.llc_service_cycles = 2
# L3 miss -> directory network/controller -> MemCtrl admission. This split is
# required because an LLC hit does not traverse these stages. The compact
# memory envelope is therefore 5 + 12 + 18 + 5 = 40 cycles, derived from the
# captured 1/2-cycle message edges and directory_latency=6.
uncore.directory_memory_latency = 18
# Memory response -> directory/L3 fill visibility is separate from the
# request-to-MemCtrl latency above: responseFromMemory/message admission (1),
# Garnet return path (5), and L3 l2_response_latency (2). This target-derived
# 8-cycle service stage extends TBE lifetime but never creates a DRAM request.
uncore.llc_fill_response_latency = 8

branch.type = tournament
branch.local_counter_bits = 2
branch.global_counter_bits = 2
branch.choice_counter_bits = 2
branch.local_history_entries = 2048
branch.local_entries = 2048
branch.global_entries = 8192
branch.choice_entries = 8192
branch.inst_shift = 0
branch.btb_entries = 4096
branch.btb_associativity = 1
branch.btb_tag_bits = 16
branch.btb_set_shift = 0
branch.ras_entries = 16
branch.indirect_sets = 256
branch.indirect_ways = 2
branch.indirect_tag_bits = 16
branch.indirect_path_length = 3
branch.indirect_speculative_path_length = 256
branch.indirect_ghr_bits = 13
branch.indirect_hash_ghr = true
branch.indirect_hash_targets = true
branch.requires_btb_hit = false
branch.update_btb_at_squash = true
# BaseO3CPU leaves squashWidth unset (NullOpt), so the ROB squashes all younger
# instructions in one cycle. Zero is FastSim's explicit representation of that
# unlimited width. The experimental shadow model therefore becomes a no-op for
# this target and cannot add post-squash rename drain cycles or scan overhead.
branch.squash_width = 0
branch.shadow_rob = false
# A branch resolved by IEW crosses iewToCommitDelay=1 and then
# commitToFetchDelay=1 before the committed target can restart fetch.
branch.mispredict_penalty = 2

dram.size = 4GiB
dram.channels = 8
dram.banks_per_channel = 16
dram.ranks_per_channel = 2
# Captured DRAMInterface topology: four bank groups within each 16-bank rank.
dram.bank_groups_per_rank = 4
dram.row_bytes = 8192
# Captured gem5 values are 14.16ns. At the configured 3GHz core clock this is
# 42.48 cycles, rounded up to preserve the timing lower bound.
dram.t_cl = 43
dram.t_rcd = 43
dram.t_rp = 43
dram.t_ras = 0
dram.t_rtp = 0
# The implementation supports captured tRRD=11, tRRD_L=15, tXAW=64 and a
# four-ACT window. Keep the ACT calendar disabled in the production profile
# until the controller-visible arrival set is certified; otherwise ACT
# ordering amplifies the same functional-arrival ambiguity as tCCD_L.
dram.t_rrd = 0
dram.t_rrd_l = 0
dram.t_xaw = 0
dram.activation_limit = 0
dram.burst_cycles = 10
# The command-calendar implementation supports captured tRAS=96, tRTP=23,
# tCCD_L=16 and tCS=5. Keep them disabled in the production profile until
# controller-arrival order is certified: applying them to the legacy merge
# order amplifies a host ordering artifact, especially at C32.
dram.t_ccd_l = 0
dram.t_cs = 0
# board.memory.mem_ctrl*.static_{front,back}end_latency are each 10ns.
dram.frontend_latency = 30
dram.backend_latency = 30
dram.scheduler = frfcfs
dram.read_buffer_size = 64
# Source-derived MemCtrl write path. LLC dirty victims enter an independent
# per-channel write buffer so demand reads retain priority until a bounded
# write-drain turn. Use --dram-separate-write-queue false only for legacy
# differential validation.
dram.separate_write_queue = true
dram.write_buffer_size = 128
dram.write_high_threshold_percent = 85
dram.write_low_threshold_percent = 50
dram.min_reads_per_switch = 16
dram.min_writes_per_switch = 16
# Functional trace issue times are lower bounds. The calibrated candidate
# window reconstructs the controller-visible subset without pretending the
# physical gem5 read queue has only eight entries.
dram.frfcfs_selection_window = 8
# The functional trace does not expose the controller-enqueue cycle. Bound
# the ambiguous ready set by core-rank producer lanes per channel, less the
# request already at the service head; the explicit value above is the cap.
dram.frfcfs_topology_scaled_window = true
# Candidate only: enable in isolated validation runs until the full gate
# accepts complete admitted-queue visibility for open_adaptive.
dram.frfcfs_full_queue_page_policy = false
# Candidate only: prevent row-cap and adaptive policy from charging two
# auto-precharges for one serviced request.
dram.frfcfs_row_cap_single_precharge = false
# Fixed-point passes compose finite LLC-TBE admission with controller order.
dram.frfcfs_passes = 4
dram.frfcfs_arrival_bucket_cycles = 64
dram.max_accesses_per_row = 16

# FastSim buffer-114 + 全 LRU 几何配置
#
# 用户决定(2026-10-12):采集端与消费端使用 buffer-114，cache 每层统一 LRU。
# 这里对齐模式、容量及替换策略，不声明请求生命周期已经与 gem5 完全一致。
# 未开启 buffer_tso_residence_certificate / buffer_tso_prepare_lifecycle。
# 候选组合及其限制见 gem5-fs-buffer114-prepare-candidate.cfg。
#
# 基线沿用维护的 native-kernel profile,仅覆盖 TSO 机制与 L2/LLC 替换策略。
config.include = gem5-fs-native-kernel.cfg

# --- buffer TSO(与采集端 --tso-store=buffer --tso-store-buffer-size=114 对称)---
# gem5 采集 config.ini: tsoStore=buffer, SQEntries=114, needsTSO=true。
core.tso_store = buffer
core.tso_store_buffer_size = 114

# buffer 模式与 store_wait_relief 互斥(config.cpp:563),关掉基线继承的该开关。
core.store_wait_relief = false

# --- cache 每层统一 LRU(与采集端 config.ini 的 L1/L2/L3=LRURP 对称)---
# 基线 L1 已是 lru;基线 L2/LLC 是 tree_plru,这里覆盖为 lru。
cache.l2.replacement = lru
cache.llc.replacement = lru

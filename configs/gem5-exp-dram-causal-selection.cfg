# Paused diagnostic candidate, not the maintained baseline.
# See docs/gem5-dram-semantic-alignment-20260907.md before using it.
# Exact gem5 DDR4 timing inputs at the captured 333-ps core period; restore
# only the previously disabled integer-cycle command constraints.
config.include = gem5-fs-native-kernel.cfg
dram.t_ras = 97
dram.t_rtp = 23
dram.t_rrd = 11
dram.t_rrd_l = 15
dram.t_xaw = 64
dram.activation_limit = 4
dram.t_ccd_l = 16
dram.t_cs = 6
dram.frfcfs_causal_selection = true
# Required to exercise FR-FCFS on C4/C8: the maintained heuristic makes its
# effective window one and bypasses the scheduler on these topologies.
dram.frfcfs_topology_scaled_window = false
sim.interval_max_cycles = 1024
core.response_pending_fill = false
core.response_pending_fill_load_admission = false
core.response_pending_fill_store_commit = false

# DR host physical-address C4 replay profile.
#
# DynamoRIO captures host physical addresses from /proc/self/pagemap and the
# current C4 collection binds the workload to node1 CPUs 48-51 with node1 memory.
# Host CPU48 sysfs reports L1D 48KiB/12-way, private L2 2MiB/16-way, and
# socket LLC 99840KiB/15-way. FastSim's current cache implementation requires
# power-of-two set counts, so this DR replay profile uses the closest supported
# power-of-two geometry that can consume the host PA stream without changing the
# simulator topology model.
#
# FastSim still treats cache/CHA/DRAM timing as diagnostic replay parameters.
# Fields that are not exposed by the read-only host topology, such as CHA count,
# DRAM channels, bank mapping, and latency penalties, remain model parameters
# rather than certified host facts.
sim.cores = 4
sim.chunk_instructions = 4096
sim.lookahead_chunks = 2

core.issue_width = 4
core.memory_exposure = 1.0
trace.strict_physical_address = true

cache.l1d.size = 64KiB
cache.l1d.associativity = 16
cache.l1d.line_size = 64
cache.l1d.hit_latency = 4
cache.l1d.replacement = lru

cache.l2.size = 2MiB
cache.l2.associativity = 16
cache.l2.line_size = 64
cache.l2.hit_latency = 12
cache.l2.replacement = lru

cache.llc.size = 128MiB
cache.llc.associativity = 16
cache.llc.line_size = 64
cache.llc.hit_latency = 36
cache.llc.replacement = lru
cache.llc.inclusive = false

uncore.coherence = true
uncore.cha_count = 8
uncore.cha_xor_hash = false
uncore.noc_one_way_latency = 12
uncore.llc_service_cycles = 2

branch.type = tournament
branch.local_counter_bits = 2
branch.global_counter_bits = 2
branch.choice_counter_bits = 2
branch.local_history_entries = 2048
branch.local_entries = 2048
branch.global_entries = 8192
branch.choice_entries = 8192
branch.inst_shift = 0
branch.btb_entries = 4096
branch.btb_associativity = 1
branch.btb_tag_bits = 16
branch.btb_set_shift = 0
branch.ras_entries = 16
branch.indirect_sets = 256
branch.indirect_ways = 2
branch.indirect_tag_bits = 16
branch.indirect_path_length = 3
branch.indirect_speculative_path_length = 256
branch.indirect_ghr_bits = 13
branch.indirect_hash_ghr = true
branch.indirect_hash_targets = true
branch.requires_btb_hit = false
branch.update_btb_at_squash = true
branch.mispredict_penalty = 16

# 52-bit host physical address aperture from lscpu. This is a PA range guard,
# not installed DRAM capacity.
dram.size = 4503599627370496
dram.channels = 8
dram.banks_per_channel = 16
dram.row_bytes = 8192
dram.t_cl = 22
dram.t_rcd = 22
dram.t_rp = 22
dram.burst_cycles = 4

# Native full-system accuracy overlay validated on the 20-case C4/C8 gate.
# Keep v28_1 immutable as the comparison baseline; this profile composes two
# orthogonal committed-stream repairs that do not require wrong-path records.
config.include = gem5-v28_1-fs-native-kernel.cfg

# Serialize committed and inferred shadow fetch-block responses through the
# target's one-response-at-a-time frontend ledger.
core.fetch_supply_model = true
core.fetch_supply_speculative_shadow = true

# Reconstruct dense same-PC x86 RMW StoreSet/LFST edges from the functional
# macro decomposition. The response scoreboard applies the edge after shared
# memory replay, at the producer store's address-generation completion.
core.store_set_same_pc_feedback = true

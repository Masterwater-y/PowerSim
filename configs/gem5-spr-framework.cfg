# Framework strategy inheriting SPR-M2. Shared numeric parameters come from
# actual gem5 objects; local calibration overrides are not frozen-M2 equivalence.
# The selected calibration profile keeps predictor-based store bypass and
# fast store forwarding disabled even when the guest SSBD bit is clear.
# FastSim does not model the guest SSBD register dynamically; store behavior
# remains its existing approximation and is not certified equivalent.
config.include = gem5-spr-retired.cfg
sim.interval_scheduler = time_epoch
sim.interval_reweave_passes = 1
core.tso_store = buffer
core.store_wait_relief = false
core.store_timing_model = legacy
core.legacy_prepare_timing = true
core.buffer_tso_prepare_lifecycle = false
# The calibration profile removed StoreSet/MDP prediction.  This disables
# FastSim's inherited same-PC proxy; it does not reproduce every gem5 LSU wait.
core.store_set_same_pc_feedback = false
# Model credit approximation; not Ruby TBEs or native shared SQ credits.
core.legacy_prepare_credits = 16
core.spr_dtlb_stlb_proxy = true
core.spr_id_stlb_retired_order = true
core.spr_shared_fu = true
# Current FastSim predictor approximations for the native GoldenCove models.
branch.type = tournament
branch.btb_multilevel = true
branch.btb_full_pc_tag = true
# Native source waits emerge from service readiness; no extra fixed penalty.
frontend.dsb_to_mite_delay = 0
# Existing interval occupancy release represents backward feedback.
core.iew_to_rename = 0
core.commit_to_rename = 0
core.spr_l1_prefetch_l2_only = false
core.spr_l1_prefetch_stream_hits = false
core.spr_l1_prefetch_line_marks = false
core.spr_l1_prefetch_suppress_issue = false
core.spr_l2_shared_prefetch = false
core.spr_l2_prefetch_follow = false
core.spr_l2_prefetch_suppress_issue = false
core.spr_l2_llc_resident_prefetch = false
core.software_prefetch_early_ack = false
# Retired prepare with the upstream two-stage v2 waiting service.
# Immutable M1/M2 profiles are available; this overlay has local differences.
core.unified_parent_service = v2-wait
core.spr_store_group_merge = false
core.spr_store_multi_group = false
core.spr_store_window_feedback = true
core.spr_store_window_lines = 4
uncore.cha_xor_hash = true
core.spr_store_sq_join_credit_proxy = false

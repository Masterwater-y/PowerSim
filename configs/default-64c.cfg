# FastSim v0.1 baseline: 64 simulated cores, 8 CHAs, 8 DRAM channels.
sim.cores = 64
sim.chunk_instructions = 4096
# Each core producer stays this many decoded chunks ahead of the conservative
# shared-state consumer.  This is host lookahead, not simulated-time lookahead.
sim.lookahead_chunks = 2

core.issue_width = 4
# 1.0 is an in-order/blocking upper bound.  Calibrate this scalar against
# timing labels until the interval/MLP core model lands.
core.memory_exposure = 1.0

trace.strict_physical_address = true

cache.l1d.size = 32KiB
cache.l1d.associativity = 8
cache.l1d.line_size = 64
cache.l1d.hit_latency = 4
cache.l1d.replacement = lru

cache.l2.size = 1MiB
cache.l2.associativity = 8
cache.l2.line_size = 64
cache.l2.hit_latency = 12
cache.l2.replacement = tree_plru

cache.llc.size = 64MiB
cache.llc.associativity = 16
cache.llc.line_size = 64
cache.llc.hit_latency = 36
cache.llc.replacement = tree_plru
cache.llc.inclusive = false

uncore.coherence = true
uncore.cha_count = 8
# false matches gem5 Ruby's cache-line interleaving; true selects FastSim's
# optional XOR-folded home hash for exploratory systems.
uncore.cha_xor_hash = false
uncore.noc_one_way_latency = 12
uncore.llc_service_cycles = 2

branch.type = tournament
branch.counter_bits = 2
branch.local_history_entries = 2048
branch.local_entries = 2048
branch.global_entries = 8192
branch.choice_entries = 8192
branch.inst_shift = 0
branch.btb_entries = 4096
branch.btb_associativity = 1
branch.btb_tag_bits = 16
branch.btb_set_shift = 0
branch.ras_entries = 16
branch.indirect_sets = 256
branch.indirect_ways = 2
branch.indirect_tag_bits = 16
branch.indirect_path_length = 3
branch.indirect_speculative_path_length = 256
branch.indirect_ghr_bits = 13
branch.indirect_hash_ghr = true
branch.indirect_hash_targets = true
branch.requires_btb_hit = false
branch.update_btb_at_squash = true
branch.mispredict_penalty = 16

dram.size = 64GiB
dram.channels = 8
dram.banks_per_channel = 16
dram.row_bytes = 8192
dram.t_cl = 22
dram.t_rcd = 22
dram.t_rp = 22
dram.burst_cycles = 4

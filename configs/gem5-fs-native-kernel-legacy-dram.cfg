# Restore the pre-2026-10-27 DRAM approximation while retaining all other
# maintained native-FS defaults. Versioned historical profiles are unchanged.
config.include = gem5-fs-native-kernel.cfg

dram.scheduler = frfcfs
dram.frfcfs_topology_scaled_window = true
dram.frfcfs_selection_window = 8
dram.frfcfs_causal_selection = false

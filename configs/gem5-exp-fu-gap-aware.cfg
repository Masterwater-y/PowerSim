# Experimental producer-side FU capacity calendar.
#
# This replaces the legacy single-tail FU allocator so ready younger UOPs can
# use legal gaps before an older dependency-delayed reservation. It does not
# enable the heavier committed-pipeline audit and remains default-off in the
# maintained native-FS profile.
config.include = gem5-fs-native-kernel.cfg

core.fu_gap_aware_schedule = true

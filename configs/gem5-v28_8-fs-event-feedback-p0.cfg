# Experimental approximate-throughput P0 over the maintained v28.6 profile.
# Every cache/instruction-fetch event is replayed. Core 0 and every other
# worker remain exact sentinels. After a shared 256-checkpoint/sentinel
# reference window, the other cores replace detailed dependency, IQ/ROB/LSQ,
# and ordered-retirement propagation through ordinary UOPs with the rolling
# sentinel penalty/UOP estimate.
# This profile is intentionally not selected by gem5-fs-native-kernel.cfg.
config.include = gem5-v28_6-fs-materialized-kernel.cfg

core.response_event_only_approximation = true
core.response_event_only_calibration_checkpoints = 256
core.response_event_only_teacher_stride = 2
core.response_event_only_teacher_offset = 1
core.response_event_only_teacher_window_epochs = 16

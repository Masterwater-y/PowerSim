# Experimental event path; this profile defaults to one core.
# Integer/FP/SIMD, ordinary loads/stores and committed-path branch recovery.
# Cold, ideal I-side/translation; conservative unknown-store disambiguation.
# Native ordinary kernel, non-memory serialization, continuous warmup and
# multicore coherence are supported through explicit configuration/input.
# Atomics, syscalls, serializing memory, ASID changes and DVFS still fail.
# This profile is for mechanism integration, not a full native-FS CPI candidate.
measurement.scope = user
sim.cores = 1
sim.chunk_instructions = 1024
sim.interval_max_cycles = 1024
core.model = causal_read
core.fetch_buffer_bytes = 0
cache.l1i.enabled = false
dtlb.enabled = false
uncore.coherence = false
uncore.inclusive_llc = false
core.memory_exposure = 1
dram.scheduler = fcfs
syscall.restart_latency = 0
# Optional streaming diagnostic output; use a project-owned tmp/ path:
# core.causal_read_audit_path = tmp/causal-read-events.csv

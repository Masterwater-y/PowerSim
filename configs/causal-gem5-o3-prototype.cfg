# BaseO3CPU phase mapping for the experimental causal event solver.
# This remains an ideal I-side/translation, FCFS mechanism profile; it is
# not a complete native-FS CPI configuration. Geometry is supplied separately.
config.include = causal-read-prototype.cfg
core.fetch_width = 8
core.decode_width = 8
core.rename_width = 8
core.dispatch_width = 8
core.issue_width = 8
core.writeback_width = 8
core.commit_width = 8
core.fetch_to_decode = 1
core.decode_to_rename = 1
core.rename_to_dispatch = 2
# IEW::tick dispatches before scheduleReadyInsts in the same cycle.
core.dispatch_to_issue = 0
# The target FU latency includes its final one-cycle issue-to-execute edge:
# InstQueue schedules a multi-cycle FU at opLat-1, then IEW executes it.
core.issue_to_execute = 0
# Commit::tick calls commit() before markCompletedInsts(): the captured
# iewToCommitDelay=1 plus one subsequent commit opportunity is two cycles.
# This edge delays retirement/ROB release, never producer wakeup.
core.execute_to_commit = 2
# MESI_Three_Level L0 mandatory queue: one cycle from accepted request to
# resident D-cache callback. RubyPort returns in the callback's own cycle.
# In the causal solver this is admission-to-response, not the legacy
# issue-to-producer-ready envelope. The memory FU owns issue-to-execute.
cache.l1d.hit_latency = 1
# MESI_Three_Level: an L1 miss includes mandatory queue (1) and the
# L0->private-L2 request message (2). Fill callback itself is same-cycle.
cache.l1d.miss_request_latency = 3
cache.l1d.fill_response_latency = 0
# Private-L2 hit, GETS/GETX send, and data return each use their own edge.
cache.l2.hit_latency = 2
cache.l2.miss_request_latency = 2
cache.l2.fill_response_latency = 2
# LLC resident response and memory fetch send use 2; memory fill replies
# use to_l1_latency=1 in this protocol, not resident l2_response_latency.
cache.llc.hit_latency = 2
cache.llc.miss_request_latency = 2
cache.llc.fill_response_latency = 1
# Captured fully connected SimpleNetwork: internal routing/link and
# external routing/outgoing link, each 1. Ext-in adds no delay.
uncore.noc_one_way_latency = 4
uncore.coherence_peer_response_latency = 2
# LLC request enqueue is above; network to directory (4) + memory queue (1).
uncore.directory_memory_latency = 5
# MemCtrl return -> Ruby response queue (1), directory send (1), network (4).
# Sub-cycle MemCtrl-to-Ruby clock alignment is not represented here.
uncore.llc_fill_response_latency = 6
# DRAM timings/geometry must still be supplied from the actual target.

# Mechanism integration profile, not a full native-FS CPI candidate.
# One functional source per core; source records and dependencies are retained.
# Complete dynamic FST dependencies bypass static operand reconstruction.
# Legacy sources with n_src > 4 still need complete functional operand coverage.
config.include = causal-read-prototype.cfg
sim.cores = 4
uncore.coherence = true
branch.speculative_history = true
measurement.native_kernel_trace = true
measurement.scope = user_plus_kernel
# Match the existing native-FS boundary: retain UOPs, bypass non-RAM lines.
trace.allow_mmio_escape = true

# Experimental TCSim-style global-time interval replay for gem5 v28.1.
# Per-core 256-UOP lower-bound windows propose variable prefixes; accepted
# memory events are gathered and woven once per global step.  Cross-core
# order changes caused by returned latency are audited, not silently certified.
sim.cores = 4
sim.chunk_instructions = 256
sim.lookahead_chunks = 2
sim.interval_target_uops = 256
# Freeze the current accuracy hyperparameter while aligning other components.
sim.interval_max_cycles = 1024

core.model = interval_weave
core.dispatch_width = 8
core.issue_width = 8
core.commit_width = 8
core.rob_entries = 192
core.iq_entries = 64
core.lq_entries = 32
core.sq_entries = 32
core.dispatch_to_issue = 1
core.integer_alu_units = 6
core.integer_multiply_units = 2
core.float_simple_units = 4
core.float_complex_units = 2
core.simd_units = 4
core.predicate_units = 1
core.memory_units = 4
core.system_units = 1
core.memory_exposure = 1.0
trace.strict_physical_address = true

cache.l1d.size = 32KiB
cache.l1d.associativity = 8
cache.l1d.line_size = 64
cache.l1d.hit_latency = 4
cache.l1d.replacement = lru
cache.l1d.mshrs = 16

cache.l2.size = 1MiB
cache.l2.associativity = 8
cache.l2.line_size = 64
cache.l2.hit_latency = 12
cache.l2.replacement = lru

cache.llc.size = 64MiB
cache.llc.associativity = 16
cache.llc.line_size = 64
cache.llc.hit_latency = 36
cache.llc.replacement = lru
cache.llc.inclusive = false

uncore.coherence = true
uncore.cha_count = 8
uncore.cha_xor_hash = false
uncore.noc_one_way_latency = 12
uncore.llc_service_cycles = 2

branch.type = tournament
branch.local_counter_bits = 2
branch.global_counter_bits = 2
branch.choice_counter_bits = 2
branch.local_history_entries = 2048
branch.local_entries = 2048
branch.global_entries = 8192
branch.choice_entries = 8192
branch.inst_shift = 0
branch.btb_entries = 4096
branch.btb_associativity = 1
branch.btb_tag_bits = 16
branch.btb_set_shift = 0
branch.ras_entries = 16
branch.indirect_sets = 256
branch.indirect_ways = 2
branch.indirect_tag_bits = 16
branch.indirect_path_length = 3
branch.indirect_speculative_path_length = 256
branch.indirect_ghr_bits = 13
branch.indirect_hash_ghr = true
branch.indirect_hash_targets = true
branch.requires_btb_hit = false
branch.update_btb_at_squash = true
branch.mispredict_penalty = 16

dram.size = 4GiB
dram.channels = 8
dram.banks_per_channel = 16
dram.row_bytes = 8192
# DDR4-2400 timings are expressed in memory-clock cycles in the gem5
# profile.  Convert to 3 GHz core cycles (2.5x) for this timing model.
dram.t_cl = 55
dram.t_rcd = 55
dram.t_rp = 55
dram.burst_cycles = 10

# Matches the principal geometry of the existing TSim v28 C32 traces.
# Those legacy aligned files do not carry predictor-independent branch
# outcomes, so their branch PMU is reported as unavailable.
sim.cores = 32
sim.chunk_instructions = 4096
sim.lookahead_chunks = 2
core.issue_width = 4
core.memory_exposure = 1.0
trace.strict_physical_address = true

cache.l1d.size = 32KiB
cache.l1d.associativity = 8
cache.l1d.line_size = 64
cache.l1d.hit_latency = 4
cache.l1d.replacement = lru

cache.l2.size = 1MiB
cache.l2.associativity = 8
cache.l2.line_size = 64
cache.l2.hit_latency = 12
cache.l2.replacement = tree_plru

cache.llc.size = 64MiB
cache.llc.associativity = 16
cache.llc.line_size = 64
cache.llc.hit_latency = 36
cache.llc.replacement = tree_plru
cache.llc.inclusive = false

uncore.coherence = true
uncore.cha_count = 8
uncore.cha_xor_hash = false
uncore.noc_one_way_latency = 12
uncore.llc_service_cycles = 2

dram.size = 4GiB
dram.channels = 8
dram.banks_per_channel = 16
dram.row_bytes = 8192

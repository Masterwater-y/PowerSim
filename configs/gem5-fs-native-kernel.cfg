# Maintained native full-system production profile.
#
# Keep versioned profiles immutable so historical experiments remain
# reproducible. Maintained launchers and user-facing examples should select
# this stable alias. The 2026-09-12 load-ready default is an explicit user
# decision; see docs/load-ready-default40-20260912.md for validation limits.
config.include = gem5-v28_9-fs-load-ready.cfg

# Bank/PRE-gated v2 store-wait repair, promoted by user decision 2026-09-16.
# Explicit rollback: --store-wait-relief false (or override this key).
# See docs/store-wait-v2-default40-20260916.md for the validation matrix.
core.store_wait_relief = true

# Rejected accuracy/throughput tradeoff; retain only for explicit experiments.
# See docs/optimization-decisions.md before revisiting this candidate.
core.response_pending_fill = false
core.response_pending_fill_load_admission = false
core.response_pending_fill_store_commit = false

# MESI_Three_Level ordinary-store timing, active only when
# core.buffer_tso_prepare_lifecycle=true. This does not enable that experiment.
# Matched against the collected buffer-114 config.ini (C4/C8/C16/C32):
# O3 commitToIEWDelay=1; IEW::tick calls writebackStores before commitStores,
# hence commit -> first possible admission = 1 + one following IEW tick.
core.store_commit_to_iew_delay = 1
# L0 mandatory_queue_latency=1 -> hh_store_hit/writeCallback -> same-tick
# RubyPort response/LSQ completeStore. No load-consumer writeback edge.
cache.l1d.store_hit_latency = 1
# Private L2 hit = L0 mandatory queue 1 + L0 request_latency 2
# + L1 l1_response_latency 2 (gem5 Ruby L0/L1 name the private L1/L2).
cache.l2.store_hit_latency = 5

# Fix C1 (2026-09-30): enable the report-only FB_HIT shadow so
# MSHR-coalesced follower loads are reclassified into
# perf_l1d_load_fb_hits at retire. Timing-neutral (see
# docs/perf-mshr-hit-mirror-alignment-20260928.md and
# docs/perf-aligned-pmu-catalog-20260930.md); disable with
# core.perf_fb_hit_mirror = false.
core.perf_fb_hit_mirror = true

# Small architecture for semantic/CI smoke only. Never use for experiments.

chunk:
  K: 256
  horizons: [16, 32, 64, 128, 256, 512, 1024]
  sample_period_cycles: 64
  sequence_length: 2
  sequence_stride: 2

scheduler:
  target_stride: 4
  min_step_cycles: 1
  max_step_cycles: 64
  max_no_progress_steps: 8

model:
  d_field: 8
  d_dynamic_field: 4
  d_static: 32
  d_dyn: 64
  n_dyn_heads: 4
  n_dyn_layers: 1
  ffn_dim: 128
  sdpa_backend: math
  cross_target_block: 0
  dropout: 0.0
  commit_temperature: 4.0
  gap_softplus_beta: 4.0

train:
  seed: 1234
  lr: 3.0e-4
  weight_decay: 0.0
  batch_samples: 1
  num_workers: 0
  trace_balanced_sampling: true
  validation_max_sequences: 0
  epochs: 2
  log_every: 1
  eval_every: 0
  save_every: 1
  amp_dtype: fp32
  profile_attention: false
  gradient_clip: 5.0
  time_huber_beta: 0.2
  progress_count_beta: 8.0
  branch_count_beta: 1.0
  loss_weights:
    commit_time: 1.0
    prefix_bce: 0.5
    progress_count: 0.5
    cumulative: 0.25
    branch_token: 0.10
    branch_count: 0.10

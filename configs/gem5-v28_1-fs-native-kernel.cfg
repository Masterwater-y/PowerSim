# Native full-system functional trace profile.
#
# The FST itself contains CPL3 and CPL0 records, so syscall/page-fault/IRQ
# service and cache-state proxies must all be disabled. Kernel instructions
# traverse the same FastSim core, TLB, cache, coherence, and DRAM models as
# user instructions.
config.include = gem5-v28_1-time-epoch.cfg

measurement.scope = user-plus-kernel
measurement.native_kernel_trace = true

# Native kernel execution replaces every synthetic kernel timing/PMU/state
# source. Keep these explicit so future base-profile changes fail closed.
syscall.service_latency = 0
syscall.restart_latency = 0
syscall.cost_model = false
syscall.event_model = false
page_fault.event_model = false
page_fault.cache_state_model = false
page_fault.syscall_semantic_model = false
page_fault.initial_pte_state_model = false
page_fault.roi_entry_page_state_model = false
irq.event_model = false

# Full-system records carry physical addresses and portable virtual-page
# tokens. MMIO is outside the cacheable DRAM domain and bypasses it explicitly.
trace.strict_physical_address = true
trace.require_virtual_page_token = true
trace.allow_cross_page_without_virtual_token = true
trace.allow_mmio_escape = true
dtlb.miss_model = timing_walk
dtlb.page_walk_latency = 12

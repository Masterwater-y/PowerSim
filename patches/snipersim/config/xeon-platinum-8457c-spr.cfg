# Intel Xeon Platinum 8457C host-matched Sniper overlay
#
# Usage:
#   ./run-sniper -n 96 -c xeon-platinum-8457c-spr -- <workload>
#
# This file is an overlay on top of config/base.cfg, which run-sniper adds
# automatically. Values derived from the local machine are taken from lscpu,
# sysfs and dmidecode. Microarchitectural values that Linux cannot expose
# directly are chosen to approximate Sapphire Rapids / Golden Cove behavior
# within the limits of Sniper's x86 model support.

[general]
enable_icache_modeling = true
total_cores = 48
num_host_cores = -1 

[perf_model/core]
# Local host cpufreq base_frequency is 2.6 GHz.
frequency = 2.6
type = interval
logical_cpus = 1
# Sniper only provides nehalem as its x86 core_model backend.
core_model = nehalem

[perf_model/core/rob_timer]
address_disambiguation = true
# Golden Cove can retire up to 8 instructions per cycle.
commit_width = 8
in_order = false
issue_contention = true
issue_memops_at_issue = true
mlp_histogram = false
# Measured / published queue-scale approximations for Golden Cove.
outstanding_loads = 192
outstanding_stores = 114
rob_repartition = true
rs_entries = 200
simultaneous_issue = true
store_to_load_forwarding = true

[perf_model/core/interval_timer]
# Golden Cove is a 6-wide design with a 512-entry ROB.
dispatch_width = 6
window_size = 512
# Approximate fill-buffer scale for outstanding miss tracking.
num_outstanding_loadstores = 16

[perf_model/branch_predictor]
type = pentium_m
# Approximate full branch mispredict recovery cost for Golden Cove.
mispredict_penalty = 17

[perf_model/tlb]
# Four page walkers and large shared TLB keep most misses off the critical path,
# but a full page walk is still expensive.
penalty = 35
penalty_parallel = true

[perf_model/itlb]
size = 256
associativity = 256

[perf_model/dtlb]
size = 96
associativity = 96

[perf_model/stlb]
size = 2048
associativity = 16

[perf_model/cache]
levels = 3

[perf_model/l1_icache]
cache_block_size = 64
cache_size = 32
associativity = 8
address_hash = mask
replacement_policy = lru
data_access_time = 5
tags_access_time = 1
perf_model_type = parallel
writethrough = 0
writeback_time = 0
dvfs_domain = core
shared_cores = 1
prefetcher = none

[perf_model/l1_dcache]
cache_block_size = 64
cache_size = 48
associativity = 12
address_hash = mask
replacement_policy = lru
data_access_time = 5
tags_access_time = 1
perf_model_type = parallel
writethrough = 0
writeback_time = 0
dvfs_domain = core
shared_cores = 1
# Golden Cove exposes 16 fill buffers for L1D miss handling.
outstanding_misses = 16
prefetcher = none

[perf_model/l2_cache]
cache_block_size = 64
cache_size = 2048
associativity = 16
address_hash = mask
replacement_policy = lru
# Golden Cove / SPR private L2 is larger but slower than prior client cores.
data_access_time = 14
tags_access_time = 5
writethrough = 0
writeback_time = 8
perf_model_type = parallel
dvfs_domain = core
shared_cores = 1
prefetcher = none

[perf_model/l3_cache]
perfect = false
cache_block_size = 64
# Local sysfs reports 99,840 KB LLC per socket.
cache_size = 99840
associativity = 15
address_hash = mod
replacement_policy = lru
data_access_time = 48
tags_access_time = 14
perf_model_type = parallel
writethrough = 0
writeback_time = 0
dvfs_domain = global
prefetcher = none
shared_cores = 48

[perf_model/llc]
evict_buffers = 28

[perf_model/dram_directory]
total_entries = 1048576
associativity = 16
directory_type = full_map
locations = llc

[perf_model/dram]
type = constant
# Conservative socket-local DDR5 latency approximation.
latency = 95
# Sniper requires DRAM controllers to sit at the master node of a shared LLC.
# We therefore model one aggregated controller per socket:
# 8 DDR5-4400 channels/socket * 35.2 GB/s = 281.6 GB/s per socket.
per_controller_bandwidth = 281.6
# One controller per LLC domain (per socket). With 96 cores this gives 2
# controllers; with -n 48 it gives 1 controller.
num_controllers = -1
controllers_interleaving = 48
chips_per_dimm = 8
# Two DIMMs are installed per channel on this host.
dimms_per_controller = 2

[perf_model/sync]
reschedule_cost = 1000

[dvfs]
type = simple
transition_latency = 2000

[dvfs/simple]
cores_per_socket = 48

[power]
vdd = 1.1
technology_node = 10

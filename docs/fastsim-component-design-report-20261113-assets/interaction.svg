<polygon points="955,735 946,730 946,740" fill="#23785c"/><text x="745.0" y="723" font-family="Noto Sans CJK SC,Noto Sans SC,DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#23785c" text-anchor="middle">9 load 延迟 → MOV 依赖 → ADD</text><polyline points="955,784 1025,784 1025,818 955,818" fill="none" stroke="#23785c" stroke-width="2.5"/><polygon points="955,818 964,813 964,823" fill="#23785c"/><text x="760" y="816" font-family="Noto Sans CJK SC,Noto Sans SC,DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#23785c" text-anchor="middle">10 顺序退休 / 统计</text><text x="34" y="876" font-family="Noto Sans CJK SC,Noto Sans SC,DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#52677c" text-anchor="start">C1 不会仅因地址相同就复用 C0 本地父服务；跨核来源由目录和共享服务处理。</text></svg>
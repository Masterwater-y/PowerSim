<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="750" viewBox="0 0 1080 750"><rect width="1080" height="100%" fill="#ffffff"/><text x="34" y="42" font-family="Noto Sans CJK SC,Noto Sans SC,DejaVu Sans,sans-serif" font-size="28" font-weight="700" fill="#1d3046" text-anchor="start">Store 父服务：一次服务有多个完成维度</text><text x="34" y="75" font-family="Noto Sans CJK SC,Noto Sans SC,DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#52677c" text-anchor="start">图示记录与消费关系；不规定完成边的固定先后，也不表示默认路径已全部独立估时</text><rect x="45" y="125" width="990" height="100" rx="12" fill="#edf4fc" stroke="#2563a6" stroke-width="1.6"/><text x="540.0" y="157" font-family="Noto Sans CJK SC,Noto Sans SC,DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#2563a6" text-anchor="middle">Retired store → canWB / SQ 条件 → prepare 准入</text><text x="540.0" y="186" font-family="Noto Sans CJK SC,Noto Sans SC,DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#1d3046" text-anchor="middle">I：GETX 可能同时取数据与权限；S：UPGRADE 主要取得权限</text><rect x="45" y="295" width="285" height="95" rx="12" fill="#edf7f2" stroke="#23785c" stroke-width="1.6"/><text x="187.5" y="327" font-family="Noto Sans CJK SC,Noto Sans SC,DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#23785c" text-anchor="middle">data_ready</text><text x="187.5" y="356" font-family="Noto Sans CJK SC,Noto Sans SC,DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#1d3046" text-anchor="middle">load 需要数据</text><rect x="397" y="295" width="285" height="95" rx="12" fill="#edf7f2" stroke="#23785c" stroke-width="1.6"/><text x="539.5" y="327" font-family="Noto Sans CJK SC,Noto Sans SC,DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#23785c" text-anchor="middle">permission_ready</text><text x="539.5" y="356" font-family="Noto Sans CJK SC,Noto Sans SC,DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#1d3046" text-anchor="middle">prepare / store 需要权限</text><rect x="750" y="295" width="285" height="95" rx="12" fill="#edf7f2" stroke="#23785c" stroke-width="1.6"/><text x="892.5" y="327" font-family="Noto Sans CJK SC,Noto Sans SC,DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#23785c" text-anchor="middle">controller_ready</text><text x="892.5" y="356" font-family="Noto Sans CJK SC,Noto Sans SC,DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#1d3046" text-anchor="middle">控制约束与对应租约</text><polyline points="187,225 187,295" fill="none" stroke="#2563a6" stroke-width="2.5"/><polygon points="187,295 182,286 192,286" fill="#2563a6"/><polyline points="539,225 539,295" fill="none" stroke="#2563a6" stroke-width="2.5"/><polygon points="539,295 534,286 544,286" fill="#2563a6"/><polyline points="892,225 892,295" fill="none" stroke="#2563a6" stroke-width="2.5"/><polygon points="892,295 887,286 897,286" fill="#2563a6"/><rect x="45" y="465" width="285" height="90" rx="12" fill="#edf7f2" stroke="#23785c" stroke-width="1.6"/><text x="187.5" y="497" font-family="Noto Sans CJK SC,Noto Sans SC,DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#23785c" text-anchor="middle">load 消费 / 依赖</text><text x="187.5" y="526" font-family="Noto Sans CJK SC,Noto Sans SC,DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#1d3046" text-anchor="middle">合格来源才复用剩余等待</text><rect x="397" y="465" width="285" height="90" rx="12" fill="#edf4fc" stroke="#2563a6" stroke-width="1.6"/><text x="539.5" y="497" font-family="Noto Sans CJK SC,Noto Sans SC,DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#2563a6" text-anchor="middle">FIFO head 的 store</text><text x="539.5" y="526" font-family="Noto Sans CJK SC,Noto Sans SC,DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#1d3046" text-anchor="middle">write_ready / 请求回调</text><rect x="750" y="465" width="285" height="90" rx="12" fill="#f4eff9" stroke="#77509d" stroke-width="1.6"/><text x="892.5" y="497" font-family="Noto Sans CJK SC,Noto Sans SC,DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#77509d" text-anchor="middle">TBE / fill 租约</text><text x="892.5" y="526" font-family="Noto Sans CJK SC,Noto Sans SC,DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#1d3046" text-anchor="middle">按资源语义释放</text><polyline points="187,390 187,465" fill="none" stroke="#23785c" stroke-width="2.5"/><polygon points="187,465 182,456 192,456" fill="#23785c"/><polyline points="539,390 539,465" fill="none" stroke="#23785c" stroke-width="2.5"/><polygon points="539,465 534,456 544,456" fill="#23785c"/><polyline points="892,390 892,465" fill="none" stroke="#77509d" stroke-width="2.5"/><polygon points="892,465 887,456 897,456" fill="#77509d"/><rect x="397" y="610" width="285" height="80" rx="12" fill="#f4eff9" stroke="#77509d" stroke-width="1.6"/><text x="539.5" y="642" font-family="Noto Sans CJK SC,Noto Sans SC,DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#77509d" text-anchor="middle">SQ 后续准入</text><text x="539.5" y="671" font-family="Noto Sans CJK SC,Noto Sans SC,DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#1d3046" text-anchor="middle">SQ 释放不是数据到达</text><polyline points="539,555 539,610" fill="none" stroke="#77509d" stroke-width="2.5"/><polygon points="539,610 534,601 544,601" fill="#77509d"/><text x="45" y="627" font-family="Noto Sans CJK SC,Noto Sans SC,DejaVu Sans,sans-serif" font-size="20" font-weight="700" fill="#1d3046" text-anchor="start">服务身份 + 代际</text><text x="45" y="657" font-family="Noto Sans CJK SC,Noto Sans SC,DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#52677c" text-anchor="start">模型 admission + 来源资格</text><text x="750" y="627" font-family="Noto Sans CJK SC,Noto Sans SC,DejaVu Sans,sans-serif" font-size="20" font-weight="700" fill="#1d3046" text-anchor="start">默认：v2-wait</text><text x="750" y="657" font-family="Noto Sans CJK SC,Noto Sans SC,DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#52677c" text-anchor="start">legacy-coupled / unknown 保留</text><text x="45" y="728" font-family="Noto Sans CJK SC,Noto Sans SC,DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#52677c" text-anchor="start">请求回调、prepare credit、TBE/fill 租约、SQ 槽位是不同对象；不能共用一个“完成”时刻。</text></svg>
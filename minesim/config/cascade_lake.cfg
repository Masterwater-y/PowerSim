[core]
fetch_width=6
decode_width=6
rename_width=6
dispatch_width=6
issue_width=8
retire_width=8

num_alu_ports=4
num_load_ports=2
num_store_ports=2
num_branch_ports=2

rob_size=224
lq_size=72
sq_size=56
iq_size=97
branch_mispredict_penalty=18

[branch_predictor]
type=bimodal
size=4096

[cache]
l1i_size_kb=32
l1i_associativity=8
l1i_line_size=64
l1i_latency=4

# SPR 8457C real values
l1d_size_kb=48
l1d_associativity=12
l1d_line_size=64
l1d_latency=4

l2_size_kb=2048
l2_associativity=16
l2_line_size=64
l2_latency=14

l3_size_kb=32768
l3_associativity=16
l3_line_size=64
l3_latency=70

[tlb]
itlb_entries=128
itlb_associativity=8
itlb_latency=1

# SPR DTLB hierarchy: per-page-size first-level + unified STLB
dtlb_4k_entries=96
dtlb_4k_associativity=4
dtlb_4k_latency=1

dtlb_2m_entries=32
dtlb_2m_associativity=4
dtlb_2m_latency=1

dtlb_1g_entries=8
dtlb_1g_associativity=8
dtlb_1g_latency=1

stlb_entries=2048
stlb_associativity=16
stlb_latency=7

[memory]
size_mb=16384
latency=100
default_page_size_kb=4
# Linux THP (2 MB) is enabled in most server workloads; vaddrs above 4 GB
# (heap/anonymous mappings) are promoted, while .text/.data below stay 4 KB.
thp_page_size_kb=2048
thp_min_vaddr=0x100000000
page_walk_latency=50

[experimental]
# Cycle-bias extensions for IPC alignment with perf
enable_mshr=true
enable_dram_bw=true
enable_partial_stlf=true
enable_sq_drain_block=true

# SPR has ~10 LFB entries; DRAM ~6 channels at ~1 transfer/4 cycles each.
mshr_capacity=10
num_dram_channels=6
dram_burst_cycles=4
partial_stlf_penalty=11
